<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cho To Hoi</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd6e7 0%, #f0b8e8 30%, #d8b4fe 65%, #a8d8f0 100%);
      font-family: "Quicksand", sans-serif;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .particle { position: fixed; pointer-events: none; will-change: transform; animation: floatUp linear infinite; opacity: 0; }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg);  opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.8; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }
    .container {
      text-align: center;
      padding: 1rem;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    #mainText {
      font-family: "Great Vibes", cursive;
      font-size: clamp(6rem, 35vw, 24rem);
      color: #fff;
      text-shadow: 4px 4px 0 #e91e8c, 8px 8px 0 #c2185b, 0 0 60px rgba(233,30,140,0.6);
      letter-spacing: 4px;
      line-height: 1.1;
      width: 100%;
      padding: 0 0.5rem;
      text-align: center;
      min-height: 1.2em;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0 0.2em;
      transition: font-size 0.5s ease;
    }
    #mainText.full {
      font-size: clamp(2.5rem, 9vw, 9rem);
      line-height: 1.45;
    }
    .word { display: inline-block; }
    #progress { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,0.28); transition: background 0.25s, transform 0.25s; }
    .dot.filled { background: rgba(255,255,255,0.95); transform: scale(1.5); }
    #hint { font-size: 1.1rem; color: rgba(255,255,255,0.9); font-style: italic; animation: pulse 1.6s ease-in-out infinite; letter-spacing: 1px; }
    #hint.hidden { display: none; }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50%       { opacity: 1;    transform: scale(1.07); }
    }
    #finalMsg {
      font-size: clamp(0.9rem, 2.2vw, 1.15rem);
      color: rgba(255,255,255,0.92);
      font-style: italic;
      letter-spacing: 1.8px;
      text-shadow: 1px 1px 5px rgba(180,0,80,0.5);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.3s ease, transform 1.3s ease;
    }
    #finalMsg.show { opacity: 1; transform: translateY(0); }
    #buttons {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease;
      pointer-events: none;
    }
    #buttons.show { opacity: 1; transform: translateY(0); pointer-events: all; }
    .btn {
      font-family: "Quicksand", sans-serif;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      font-weight: 700;
      padding: 0.7em 2em;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active { transform: scale(0.95); }
    .btn-yes  { background: #22c55e; color: #fff; }
    .btn-no   { background: #ef4444; color: #fff; }
    #replyMsg {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2rem, 8vw, 5rem);
      color: #fff;
      text-shadow: 2px 2px 0 #e91e8c, 0 0 30px rgba(233,30,140,0.5);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    #replyMsg.show { opacity: 1; transform: translateY(0); }
    .petal-wrapper { position: fixed; pointer-events: none; z-index: 1000; width: 0; height: 0; will-change: transform; transform: rotate(var(--rot)); }
    .petal-inner { font-size: 1.8rem; position: absolute; will-change: transform, opacity; animation: petalBloom 1s ease-out forwards; animation-delay: var(--delay, 0s); }
    @keyframes petalBloom {
      0%   { transform: translate(-50%,-50%) translateY(0px)    scale(0);   opacity: 0; }
      15%  {                                                                  opacity: 1; }
      35%  { transform: translate(-50%,-50%) translateY(-30px)  scale(1.6); opacity: 1; }
      80%  { transform: translate(-50%,-50%) translateY(-78px)  scale(1.1); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) translateY(-110px) scale(0.2); opacity: 0; }
    }
    .petal-center { position: fixed; pointer-events: none; z-index: 1001; font-size: 2rem; animation: centerPop 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes centerPop {
      0%   { transform: translate(-50%,-50%) scale(0);   opacity: 1; }
      55%  { transform: translate(-50%,-50%) scale(2.2); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(0.1); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="mainText"></div>
    <div id="progress"></div>
    <div id="hint">✨ Bấm vào màn hình nhé~ ✨</div>
    <div id="finalMsg">~ Tôi không cho phép em từ chối ~</div>
    <div id="buttons">
      <button class="btn btn-yes" onclick="answer()">coá</button>
      <button class="btn btn-no"  onclick="answer()">có, nhưng màu đỏ</button>
    </div>
    <div id="replyMsg">8h sáng chủ nhật tớ qua đón đi nhé 🥰</div>
  </div>
  <script>
    var words = ["Chủ","Nhật","Này","Cậu","rảnh","Không","đi","chơi","với","tớ","điiiiii"];
    var idx = 0, done = false;
    var mainText = document.getElementById("mainText");
    var progress = document.getElementById("progress");
    var hint     = document.getElementById("hint");
    var finalMsg = document.getElementById("finalMsg");
    var buttons   = document.getElementById("buttons");
    var replyMsg  = document.getElementById("replyMsg");

    function answer() {
      buttons.classList.remove("show");
      setTimeout(function() {
        replyMsg.classList.add("show");
      }, 400);
    }
    words.forEach(function(_, i) {
      var dot = document.createElement("div");
      dot.className = "dot";
      dot.id = "dot-" + i;
      progress.appendChild(dot);
    });
    var bgEmojis = ["🌸","💕","✨","🌺","💫","🦋","🍀","⭐","🎀","💗","🌷"];
    function spawnParticle() {
      var el = document.createElement("div");
      el.className = "particle";
      el.textContent = bgEmojis[Math.floor(Math.random() * bgEmojis.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (Math.random() * 1.4 + 0.7) + "rem";
      var dur = Math.random() * 9 + 7;
      el.style.animationDuration = dur + "s";
      el.style.animationDelay = (Math.random() * 4) + "s";
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, (dur + 4) * 1000);
    }
    for (var i = 0; i < 5; i++) spawnParticle();
    setInterval(spawnParticle, 3000);
    var petalEmojis = ["🌸","🌺","🌹","🌼","💮","🌷","🌻"];
    function createFlowerBloom(x, y) {
      for (var p = 0; p < 5; p++) {
        var wrapper = document.createElement("div");
        wrapper.className = "petal-wrapper";
        wrapper.style.left = x + "px";
        wrapper.style.top  = y + "px";
        wrapper.style.setProperty("--rot", (p * 72) + "deg");
        var inner = document.createElement("div");
        inner.className = "petal-inner";
        inner.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
        inner.style.setProperty("--delay", (p * 0.05) + "s");
        wrapper.appendChild(inner);
        document.body.appendChild(wrapper);
        setTimeout(function() { this.remove(); }.bind(wrapper), 1300);
      }
      var center = document.createElement("div");
      center.className = "petal-center";
      center.textContent = "✨";
      center.style.left = x + "px";
      center.style.top  = y + "px";
      document.body.appendChild(center);
      setTimeout(function() { center.remove(); }, 800);
    }
    document.body.addEventListener("click", function(e) {
      createFlowerBloom(e.clientX, e.clientY);
      if (done) return;
      if (idx === 0) hint.classList.add("hidden");
      if (idx < words.length) {
        var isLast = (idx === words.length - 1);
        if (isLast) {
          /* Show last word big, then auto-reveal full sentence */
          mainText.innerHTML = "";
          var lastSpan = document.createElement("span");
          lastSpan.className = "word";
          lastSpan.textContent = words[idx];
          mainText.appendChild(lastSpan);
          document.getElementById("dot-" + idx).classList.add("filled");
          idx = words.length;
          done = true;
          setTimeout(function() {
            mainText.innerHTML = "";
            mainText.classList.add("full");
            words.forEach(function(w) {
              var sp = document.createElement("span");
              sp.className = "word";
              sp.textContent = w;
              mainText.appendChild(sp);
            });
            setTimeout(function() {
              finalMsg.classList.add("show");
              setTimeout(function() { buttons.classList.add("show"); }, 1200);
            }, 700);
          }, 1000);
        } else {
          mainText.innerHTML = "";
          var span = document.createElement("span");
          span.className = "word";
          span.textContent = words[idx];
          mainText.appendChild(span);
          document.getElementById("dot-" + idx).classList.add("filled");
          idx++;
        }
      }
    });
  </script>
</body>
</html>
