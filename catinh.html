<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ket qua ~ Ca tinh</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a0a;
  font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2rem;padding:2rem;
  overflow:hidden;user-select:none}
.grid{position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none}
.glitch{position:fixed;inset:0;pointer-events:none;animation:glitch 6s infinite}
@keyframes glitch{
  0%,94%,100%{background:transparent}
  95%{background:rgba(255,0,100,.03)}
  97%{background:rgba(0,255,200,.03)}
}
.card{position:relative;max-width:580px;width:100%;text-align:left;
  border:1px solid rgba(255,255,255,.12);border-radius:4px;
  padding:3rem;background:#111}
.badge{display:inline-block;background:#ff003c;color:#fff;
  font-family:'Syne',sans-serif;font-size:.7rem;font-weight:800;
  letter-spacing:3px;padding:.3em .8em;margin-bottom:1.5rem}
h1{font-family:'Syne',sans-serif;font-size:clamp(2.2rem,8vw,4rem);
  font-weight:800;color:#fff;line-height:1;margin-bottom:1.2rem}
h1 span{color:#ff003c}
.sub{font-size:1rem;color:rgba(255,255,255,.55);line-height:1.8;margin-bottom:2rem}
.skills{display:flex;flex-direction:column;gap:.7rem;margin-bottom:2rem}
.skill-row{display:flex;align-items:center;gap:1rem}
.skill-name{color:rgba(255,255,255,.4);font-size:.78rem;letter-spacing:2px;width:90px;flex-shrink:0}
.skill-bar{flex:1;height:2px;background:rgba(255,255,255,.1)}
.skill-fill{height:100%;width:0;background:#ff003c;
  transition:width 1s cubic-bezier(.22,1,.36,1)}
.skill-val{color:#ff003c;font-size:.8rem;font-weight:700;width:32px;text-align:right}
.invite{font-family:'Syne',sans-serif;font-size:clamp(1rem,3.5vw,1.4rem);
  color:#fff;border-top:1px solid rgba(255,255,255,.1);
  padding-top:1.5rem;margin-top:.5rem;
  opacity:0;transform:translateY(10px);
  transition:opacity 1s ease,transform 1s ease}
.invite.show{opacity:1;transform:translateY(0)}
.invite span{color:#ff003c}
/* ── invite phase ── */
#phase2{display:none;width:100%;max-width:580px;text-align:center}
#mainText{font-family:'Syne',sans-serif;font-size:clamp(4rem,28vw,18rem);font-weight:800;color:#fff;
  text-shadow:2px 2px 0 #ff003c;min-height:1.2em;
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 .15em;padding:.5rem;transition:font-size .5s ease}
#mainText.full{font-size:clamp(1.8rem,6vw,5rem);line-height:1.5}
.word{display:inline-block}
#progress{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dot{width:11px;height:11px;border-radius:1px;background:rgba(255,255,255,.1);transition:background .25s,transform .25s}
.dot.filled{background:#ff003c;transform:scale(1.5)}
#hint{font-size:1.05rem;color:rgba(255,255,255,.4);font-family:'Inter',sans-serif;letter-spacing:2px;font-size:.85rem;
  animation:pulse 1.6s ease-in-out infinite}
#hint.hidden{display:none}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
#finalMsg{font-size:clamp(.85rem,2vw,1rem);color:rgba(255,255,255,.4);letter-spacing:2px;font-family:'Inter',sans-serif;
  opacity:0;transform:translateY(20px);transition:opacity 1.3s ease,transform 1.3s ease}
#finalMsg.show{opacity:1;transform:translateY(0)}
#buttons{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap;
  opacity:0;transform:translateY(16px);transition:opacity 1s ease,transform 1s ease;pointer-events:none}
#buttons.show{opacity:1;transform:translateY(0);pointer-events:all}
.btn{font-family:'Syne',sans-serif;font-size:clamp(1rem,3.5vw,1.3rem);font-weight:700;
  padding:.7em 2em;border:none;border-radius:2px;cursor:pointer;letter-spacing:2px;
  box-shadow:0 4px 18px rgba(0,0,0,.5);transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn-yes{background:#22c55e;color:#fff}.btn-no{background:#ef4444;color:#fff}
#replyMsg{font-family:'Syne',sans-serif;font-size:clamp(1.4rem,5vw,3.5rem);font-weight:800;color:#fff;
  letter-spacing:1px;opacity:0;transform:translateY(16px);transition:opacity 1.2s ease,transform 1.2s ease}
#replyMsg.show{opacity:1;transform:translateY(0)}
#replyMsg span{color:#ff003c}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glitch"></div>
<div class="card">
  <div class="badge">RESULT</div>
  <h1>C&#193;<span> T&#205;NH</span><br>MARKETER</h1>
  <p class="sub">
    Bold. Controversial. Kh&#243; khen nh&#432;ng khi ch&#7841;y l&#224; ch&#7841;y.<br>
    Lo&#7841;i ng&#432;&#7901;i l&#224;m campaign ng&#432;&#7901;i ta nh&#7899; m&#227;i.
  </p>
  <div class="skills">
    <div class="skill-row">
      <div class="skill-name">BOLD</div>
      <div class="skill-bar"><div class="skill-fill" id="s1"></div></div>
      <div class="skill-val" id="v1">0%</div>
    </div>
    <div class="skill-row">
      <div class="skill-name">EDGE</div>
      <div class="skill-bar"><div class="skill-fill" id="s2"></div></div>
      <div class="skill-val" id="v2">0%</div>
    </div>
    <div class="skill-row">
      <div class="skill-name">IMPACT</div>
      <div class="skill-bar"><div class="skill-fill" id="s3"></div></div>
      <div class="skill-val" id="v3">0%</div>
    </div>
  </div>
  <div class="invite" id="invite">
    Ch&#7911; Nh&#7853;t n&#224;y &#8212; <span>ra ngo&#224;i kh&#244;ng?</span>
  </div>
</div>

<!-- phase 2: word-by-word invite -->
<div id="phase2">
  <div id="mainText"></div>
  <div id="progress"></div>
  <div id="hint">// CLICK TO REVEAL //</div>
  <div id="finalMsg">~ T&#212;I KH&#212;NG CHO PH&#201;P EM T&#7915; CH&#7892;I ~</div>
  <div id="buttons">
    <button class="btn btn-yes" onclick="answer()">CO&#193;</button>
    <button class="btn btn-no" onclick="answer()">C&#211;, NH&#431;NG M&#192;U &#272;&#7896;</button>
  </div>
  <div id="replyMsg">8H S&#193;NG <span>CH&#7911; NH&#7852;T</span> T&#7900; QUA &#272;&#211;N &#128522;</div>
</div>
<script>
function animBar(fillId,valId,target){
  var fill=document.getElementById(fillId);
  var val=document.getElementById(valId);
  fill.style.width=target+"%";
  var cur=0;
  var iv=setInterval(function(){
    cur+=2;if(cur>target)cur=target;
    val.textContent=cur+"%";
    if(cur>=target)clearInterval(iv);
  },20);
}
setTimeout(function(){
  animBar("s1","v1",94);
  setTimeout(function(){animBar("s2","v2",88)},200);
  setTimeout(function(){animBar("s3","v3",91)},400);
},500);
setTimeout(function(){
  document.getElementById("invite").classList.add("show");
},2500);

// Transition to word-by-word
setTimeout(function(){
  var card=document.querySelector('.card');
  card.style.transition='opacity .8s ease,transform .8s ease';
  card.style.opacity='0';card.style.transform='translateY(-20px)';
  setTimeout(function(){
    card.style.display='none';
    document.getElementById('phase2').style.display='block';
    initInvite();
  },800);
},5500);

function initInvite(){
  var words=["Ch\u1ee7","Nh\u1eadt","N\u00e0y","C\u1eadu","r\u1ea3nh","Kh\u00f4ng","\u0111i","ch\u01a1i","v\u1edbi","t\u1edb","\u0111i\u0069\u0069\u0069\u0069\u0069"];
  var idx=0,done=false;
  var mt=document.getElementById('mainText');
  var prog=document.getElementById('progress');
  var hint=document.getElementById('hint');
  var finalMsg=document.getElementById('finalMsg');
  var buttons=document.getElementById('buttons');
  var replyMsg=document.getElementById('replyMsg');
  words.forEach(function(_,i){var d=document.createElement('div');d.className='dot';d.id='dot-'+i;prog.appendChild(d);});
  document.body.addEventListener('click',function(e){
    if(done)return;
    if(idx===0)hint.classList.add('hidden');
    if(idx<words.length){
      var isLast=(idx===words.length-1);
      if(isLast){
        mt.innerHTML='';var ls=document.createElement('span');ls.className='word';ls.textContent=words[idx];mt.appendChild(ls);
        document.getElementById('dot-'+idx).classList.add('filled');
        idx=words.length;done=true;
        setTimeout(function(){mt.innerHTML='';mt.classList.add('full');words.forEach(function(w){var sp=document.createElement('span');sp.className='word';sp.textContent=w;mt.appendChild(sp);});setTimeout(function(){finalMsg.classList.add('show');setTimeout(function(){buttons.classList.add('show');},1200);},700);},1000);
      } else {
        mt.innerHTML='';var sp=document.createElement('span');sp.className='word';sp.textContent=words[idx];mt.appendChild(sp);
        document.getElementById('dot-'+idx).classList.add('filled');idx++;
      }
    }
  });
  window.answer=function(){buttons.classList.remove('show');setTimeout(function(){replyMsg.classList.add('show');},400);};
}
</script>
</body>
</html>
