<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ket qua ~ Cute</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#ffd6e7,#ffb3d1,#f0c4f8,#c9a6f5);
  font-family:'Quicksand',sans-serif;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.8rem;padding:2rem;
  overflow:hidden;cursor:default;user-select:none}
.float{position:fixed;pointer-events:none;animation:up linear infinite;opacity:0}
@keyframes up{0%{transform:translateY(110vh) rotate(0deg);opacity:0}
10%{opacity:.7}90%{opacity:.7}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}
.card{background:rgba(255,255,255,.45);backdrop-filter:blur(14px);
  border:2px solid rgba(255,255,255,.7);border-radius:28px;
  padding:2.5rem 3rem;max-width:560px;width:100%;text-align:center;
  box-shadow:0 12px 40px rgba(200,60,120,.18)}
.icon{font-size:4rem;margin-bottom:.5rem}
h1{font-family:'Dancing Script',cursive;font-size:clamp(2.2rem,7vw,3.8rem);
  color:#d63384;text-shadow:2px 2px 0 #ff85c2;margin-bottom:.8rem}
.sub{font-size:1.05rem;color:#8b457a;line-height:1.7;margin-bottom:1.4rem}
.tag{display:inline-block;background:#ffb6d9;color:#8b0051;
  border-radius:999px;padding:.35em 1.1em;font-size:.88rem;
  font-weight:700;margin:.25rem;letter-spacing:.5px}
.invite{margin-top:1.8rem;font-family:'Dancing Script',cursive;
  font-size:clamp(1.5rem,5vw,2.4rem);color:#c2185b;
  opacity:0;transform:translateY(16px);
  transition:opacity 1.2s ease,transform 1.2s ease}
.invite.show{opacity:1;transform:translateY(0)}
.hearts{font-size:2rem;letter-spacing:.5rem;min-height:2.5rem}
/* ── invite phase ── */
#phase2{display:none;width:100%;max-width:560px;text-align:center}
#mainText{font-family:'Dancing Script',cursive;font-size:clamp(4rem,28vw,18rem);color:#d63384;
  text-shadow:3px 3px 0 #ff85c2,0 0 40px rgba(214,51,132,.4);
  min-height:1.2em;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 .2em;padding:.5rem;transition:font-size .5s ease}
#mainText.full{font-size:clamp(2rem,7vw,7rem);line-height:1.5}
.word{display:inline-block}
#progress{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(214,51,132,.25);transition:background .25s,transform .25s}
.dot.filled{background:#d63384;transform:scale(1.5)}
#hint{font-size:1.05rem;color:rgba(214,51,132,.8);font-style:italic;animation:pulse 1.6s ease-in-out infinite;letter-spacing:1px}
#hint.hidden{display:none}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
#finalMsg{font-size:clamp(.9rem,2.2vw,1.1rem);color:#8b457a;font-style:italic;letter-spacing:1.8px;
  opacity:0;transform:translateY(20px);transition:opacity 1.3s ease,transform 1.3s ease}
#finalMsg.show{opacity:1;transform:translateY(0)}
#buttons{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap;
  opacity:0;transform:translateY(16px);transition:opacity 1s ease,transform 1s ease;pointer-events:none}
#buttons.show{opacity:1;transform:translateY(0);pointer-events:all}
.btn{font-family:'Quicksand',sans-serif;font-size:clamp(1rem,3.5vw,1.4rem);font-weight:700;
  padding:.7em 2em;border:none;border-radius:999px;cursor:pointer;letter-spacing:1px;
  box-shadow:0 4px 18px rgba(0,0,0,.15);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.95)}
.btn-yes{background:#22c55e;color:#fff}.btn-no{background:#ef4444;color:#fff}
#replyMsg{font-family:'Dancing Script',cursive;font-size:clamp(2rem,8vw,5rem);color:#d63384;
  text-shadow:2px 2px 0 #ff85c2,0 0 30px rgba(214,51,132,.4);
  opacity:0;transform:translateY(16px);transition:opacity 1.2s ease,transform 1.2s ease}
#replyMsg.show{opacity:1;transform:translateY(0)}
.petal-wrapper{position:fixed;pointer-events:none;z-index:1000;width:0;height:0;will-change:transform;transform:rotate(var(--rot))}
.petal-inner{font-size:1.8rem;position:absolute;will-change:transform,opacity;animation:petalBloom 1s ease-out forwards;animation-delay:var(--delay,0s)}
@keyframes petalBloom{0%{transform:translate(-50%,-50%) translateY(0) scale(0);opacity:0}15%{opacity:1}35%{transform:translate(-50%,-50%) translateY(-30px) scale(1.6);opacity:1}80%{transform:translate(-50%,-50%) translateY(-78px) scale(1.1);opacity:.8}100%{transform:translate(-50%,-50%) translateY(-110px) scale(.2);opacity:0}}
.petal-center{position:fixed;pointer-events:none;z-index:1001;font-size:2rem;animation:centerPop .75s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes centerPop{0%{transform:translate(-50%,-50%) scale(0);opacity:1}55%{transform:translate(-50%,-50%) scale(2.2);opacity:1}100%{transform:translate(-50%,-50%) scale(.1);opacity:0}}
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#128150;</div>
  <h1>Gu Cute &#10024;</h1>
  <p class="sub">
    Soft, &#7845;m &#225;p, bi&#7871;t n&#226;ng niu c&#7843;m x&#250;c ng&#432;&#7901;i kh&#225;c.<br>
    Ki&#7875;u ng&#432;&#7901;i m&#224; campaign n&#224;o c&#361;ng c&#7847;n &#8212; gi&#7919; cho th&#432;&#417;ng hi&#7879;u lu&#244;n &#273;&#225;ng y&#234;u.
  </p>
  <div>
    <span class="tag">Storytelling</span>
    <span class="tag">Emotional Design</span>
    <span class="tag">Brand Warmth</span>
  </div>
  <div class="hearts" id="hearts"></div>
</div>

<!-- phase 2: word-by-word invite -->
<div id="phase2">
  <div id="mainText"></div>
  <div id="progress"></div>
  <div id="hint">&#10024; B&#7845;m v&#224;o m&#224;n h&#236;nh nh&#233;~ &#10024;</div>
  <div id="finalMsg">~ T&#244;i kh&#244;ng cho ph&#233;p em t&#7915; ch&#7889;i ~</div>
  <div id="buttons">
    <button class="btn btn-yes" onclick="answer()">co&#225;</button>
    <button class="btn btn-no" onclick="answer()">c&#243;, nh&#432;ng m&#224;u &#273;&#7887;</button>
  </div>
  <div id="replyMsg">8h s&#225;ng ch&#7911; nh&#7853;t t&#7899; qua &#273;&#243;n &#273;i nh&#233; &#128522;</div>
</div>
<script>
var emojis=["&#127800;","&#128149;","&#10024;","&#127802;","&#128156;","&#127803;","&#127809;"];
function spawn(){
  var el=document.createElement("div");
  el.className="float";
  el.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
  el.style.left=Math.random()*100+"vw";
  el.style.fontSize=(Math.random()*.9+.5)+"rem";
  var d=Math.random()*8+6;
  el.style.animationDuration=d+"s";
  el.style.animationDelay=Math.random()*3+"s";
  document.body.appendChild(el);
  setTimeout(function(){el.remove()},(d+3)*1000);
}
for(var i=0;i<10;i++)spawn();
setInterval(spawn,2000);
var h=document.getElementById("hearts");
var hArr=["&#128150;","&#128148;","&#10084;","&#128157;","&#128155;"];
var hi=0;
var iv=setInterval(function(){
  if(hi<hArr.length){h.innerHTML+=hArr[hi]+" ";hi++;}
  else clearInterval(iv);
},300);
// After card fades, transition to word-by-word
setTimeout(function(){
  var card=document.querySelector('.card');
  card.style.transition='opacity .8s ease,transform .8s ease';
  card.style.opacity='0';card.style.transform='translateY(-20px)';
  setTimeout(function(){
    card.style.display='none';
    document.getElementById('phase2').style.display='block';
    initInvite();
  },800);
},hArr.length*300+3200);

function initInvite(){
  var words=["Ch\u1ee7","Nh\u1eadt","N\u00e0y","C\u1eadu","r\u1ea3nh","Kh\u00f4ng","\u0111i","ch\u01a1i","v\u1edbi","t\u1edb","\u0111i\u0069\u0069\u0069\u0069\u0069"];
  var idx=0,done=false;
  var mt=document.getElementById('mainText');
  var prog=document.getElementById('progress');
  var hint=document.getElementById('hint');
  var finalMsg=document.getElementById('finalMsg');
  var buttons=document.getElementById('buttons');
  var replyMsg=document.getElementById('replyMsg');
  words.forEach(function(_,i){var d=document.createElement('div');d.className='dot';d.id='dot-'+i;prog.appendChild(d);});
  var petalEmojis=["&#127800;","&#128149;","&#10024;","&#127802;","&#128156;"];
  function bloom(x,y){for(var p=0;p<5;p++){var w=document.createElement('div');w.className='petal-wrapper';w.style.left=x+'px';w.style.top=y+'px';w.style.setProperty('--rot',(p*72)+'deg');var inner=document.createElement('div');inner.className='petal-inner';inner.innerHTML=petalEmojis[Math.floor(Math.random()*petalEmojis.length)];inner.style.setProperty('--delay',(p*.05)+'s');w.appendChild(inner);document.body.appendChild(w);setTimeout(function(){this.remove()}.bind(w),1300);}var c=document.createElement('div');c.className='petal-center';c.textContent='\u2728';c.style.left=x+'px';c.style.top=y+'px';document.body.appendChild(c);setTimeout(function(){c.remove()},800);}
  document.body.addEventListener('click',function(e){
    bloom(e.clientX,e.clientY);
    if(done)return;
    if(idx===0)hint.classList.add('hidden');
    if(idx<words.length){
      var isLast=(idx===words.length-1);
      if(isLast){
        mt.innerHTML='';var ls=document.createElement('span');ls.className='word';ls.textContent=words[idx];mt.appendChild(ls);
        document.getElementById('dot-'+idx).classList.add('filled');
        idx=words.length;done=true;
        setTimeout(function(){mt.innerHTML='';mt.classList.add('full');words.forEach(function(w){var sp=document.createElement('span');sp.className='word';sp.textContent=w;mt.appendChild(sp);});setTimeout(function(){finalMsg.classList.add('show');setTimeout(function(){buttons.classList.add('show');},1200);},700);},1000);
      } else {
        mt.innerHTML='';var sp=document.createElement('span');sp.className='word';sp.textContent=words[idx];mt.appendChild(sp);
        document.getElementById('dot-'+idx).classList.add('filled');idx++;
      }
    }
  });
  window.answer=function(){buttons.classList.remove('show');setTimeout(function(){replyMsg.classList.add('show');},400);};
}
</script>
</body>
</html>
